---
# handlers file for initial_setup
- name: restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted
- name: restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
- name: restart webhook
  ansible.builtin.systemd:
    name: webhook
    state: restarted
- name: restart wireguard
  ansible.builtin.systemd:
    name: wg-quick@wg0
    state: restarted
- name: restart apparmor
  ansible.builtin.service:
    name: apparmor
    state: restarted

- name: restart traefik app service
  ansible.builtin.systemd:
    name: app.service
    scope: user
    state: restarted
    daemon_reload: yes
  become: yes
  become_user: traefik_proxy
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ app_user_uid.stdout | default('$(id -u traefik_proxy)', true) }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ app_user_uid.stdout | default('$(id -u traefik_proxy)', true) }}/bus"

- name: restart dnsmasq
  ansible.builtin.service:
    name: dnsmasq
    state: restarted
