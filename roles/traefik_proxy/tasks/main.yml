---
# tasks file for Traefik setup

- name: Ensure traefik group exists
  ansible.builtin.group:
    name: traefik
    state: present
  become: yes

- name: Create traefik_proxy user
  ansible.builtin.user:
    name: traefik_proxy
    shell: /usr/sbin/nologin
    system: yes
    create_home: yes
    group: traefik
  become: yes

- name: Create /etc/traefik directory
  ansible.builtin.file:
    path: /etc/traefik
    state: directory
    owner: root
    group: traefik
    mode: '0755'
  become: yes

- name: Create /etc/traefik/dynamic directory
  ansible.builtin.file:
    path: /etc/traefik/dynamic
    state: directory
    owner: root
    group: traefik
    mode: '2775'
  become: yes

- name: Create /opt/traefik/sockets directory
  ansible.builtin.file:
    path: /opt/traefik/sockets
    state: directory
    owner: root
    group: traefik
    mode: '2770'
  become: yes

- name: Allow HTTP and HTTPS through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - 80
    - 443
  become: yes

- name: Set app_user for rootless docker
  ansible.builtin.set_fact:
    app_user: traefik_proxy

- name: Setup rootless docker for traefik_proxy
  ansible.builtin.include_role:
    name: docker_host
    tasks_from: rootless_docker.yml

- name: Create Traefik app directory
  ansible.builtin.file:
    path: "/home/traefik_proxy/app"
    state: directory
    owner: traefik_proxy
    group: traefik
    mode: '0755'
  become: yes

- name: Create LetsEncrypt acme.json file
  ansible.builtin.file:
    path: "/home/traefik_proxy/app/acme.json"
    state: touch
    owner: traefik_proxy
    group: traefik
    mode: '0600'
  become: yes

- name: Template Traefik global dynamic config
  ansible.builtin.template:
    src: traefik-dynamic-global.yml.j2
    dest: "/etc/traefik/dynamic/00-global.yml"
    owner: root
    group: traefik
    mode: '0644'
  become: yes

- name: Template Traefik docker-compose.yml
  ansible.builtin.template:
    src: traefik-docker-compose.yml.j2
    dest: "/home/traefik_proxy/app/docker-compose.yml"
    owner: traefik_proxy
    group: traefik
    mode: '0644'
  notify: restart traefik app service
  become: yes

- name: Create systemd user directory for traefik_proxy
  ansible.builtin.file:
    path: "/home/traefik_proxy/.config/systemd/user"
    state: directory
    owner: traefik_proxy
    group: traefik
    mode: '0755'
  become: yes

- name: Template Traefik systemd service
  ansible.builtin.template:
    src: traefik-app.service.j2
    dest: "/home/traefik_proxy/.config/systemd/user/app.service"
    owner: traefik_proxy
    group: traefik
    mode: '0644'
  become: yes
  notify: restart traefik app service

- name: Enable and start Traefik service
  ansible.builtin.systemd:
    name: app.service
    scope: user
    enabled: yes
    state: started
    daemon_reload: yes
  become: yes
  become_user: traefik_proxy
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ app_user_uid.stdout | default('$(id -u traefik_proxy)', true) }}"
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path=/run/user/{{ app_user_uid.stdout | default('$(id -u traefik_proxy)', true) }}/bus
