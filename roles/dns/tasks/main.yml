---
# tasks file for dns
- name: Install dnsmasq
  ansible.builtin.apt:
    name: dnsmasq
    state: present
  register: apt_install_dnsmasq_result
  until: apt_install_dnsmasq_result is successful
  retries: 10
  delay: 10
  become: yes

- name: Allow DNS (53/udp) on VPN interface
  community.general.ufw:
    rule: allow
    port: '53'
    proto: udp
    direction: in
    interface: wg0
  become: yes

- name: Configure dnsmasq for internal domain
  ansible.builtin.copy:
    dest: /etc/dnsmasq.d/internal.conf
    content: |
      listen-address=10.0.0.1
      bind-dynamic
      address=/traefik.internal/10.0.0.1
      server=8.8.8.8
      server=8.8.4.4
      domain-needed
      bogus-priv
      no-hosts
    mode: '0644'
  notify: restart dnsmasq
  become: yes

- name: Create systemd override directory for dnsmasq
  ansible.builtin.file:
    path: /etc/systemd/system/dnsmasq.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Configure dnsmasq to wait for WireGuard interface
  ansible.builtin.copy:
    dest: /etc/systemd/system/dnsmasq.service.d/override.conf
    content: |
      [Unit]
      After=wg-quick@wg0.service
      Wants=wg-quick@wg0.service
    mode: '0644'
  become: yes
  notify: restart dnsmasq

- name: Ensure dnsmasq is enabled and started
  ansible.builtin.systemd:
    name: dnsmasq
    state: started
    enabled: yes
    daemon_reload: yes
  become: yes