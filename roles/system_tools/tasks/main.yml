---
# tasks file for system_tools
- name: Install Python packages
  ansible.builtin.apt:
    name:
      - python3-flask
      - python3-pip
      - virtualenv
      - python3-setuptools
      - gunicorn
      - python3-requests
    state: present
  become: yes
  register: apt_install_python_result
  until: apt_install_python_result is successful
  retries: 10
  delay: 10

- name: Create webhook group
  ansible.builtin.group:
    name: webhook
    state: present
  become: yes

- name: Create webhook user
  ansible.builtin.user:
    name: webhook
    group: webhook
    shell: /usr/sbin/nologin
    home: /opt/webhook
    create_home: no
    state: present
  become: yes

- name: Create webhook directory
  ansible.builtin.file:
    path: /opt/webhook
    state: directory
    owner: webhook
    group: webhook
    mode: '0750'
  become: yes

- name: Create webhook config directory
  ansible.builtin.file:
    path: /opt/webhook/conf.d
    state: directory
    owner: root
    group: webhook
    mode: '0750'
  become: yes

- name: Create webhook listener script
  ansible.builtin.template:
    src: webhook_listener.py.j2
    dest: /opt/webhook/webhook_listener.py
    owner: webhook
    group: webhook
    mode: '0700'
  notify: restart webhook
  become: yes

- name: Create update script
  ansible.builtin.template:
    src: update.sh.j2
    dest: /opt/webhook/update.sh
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Configure sudoers for webhook user
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/webhook
    create: yes
    mode: '0440'
    line: "webhook ALL=(root) NOPASSWD: /opt/webhook/update.sh"
    validate: /usr/sbin/visudo -cf %s
  become: yes

- name: Create systemd service for webhook listener
  ansible.builtin.template:
    src: webhook.service.j2
    dest: /etc/systemd/system/webhook.service
  vars:
    github_token_env: "{% if github_pat %}Environment=GITHUB_TOKEN={{ github_pat }}{% endif %}"
  notify: restart webhook
  become: yes

- name: Ensure webhook service is enabled and started
  ansible.builtin.systemd:
    name: webhook
    enabled: yes
    state: started
    daemon_reload: yes
  become: yes

- name: Install tar
  ansible.builtin.apt:
    name:
      - tar
    state: present
  become: yes

- name: Create backup directory
  ansible.builtin.file:
    path: /var/backups/apps
    state: directory
    mode: '0700'
    owner: root
    group: root
  become: yes

- name: Deploy backup script
  ansible.builtin.template:
    src: backup_apps.sh.j2
    dest: /usr/local/bin/backup_apps.sh
    mode: '0700'
    owner: root
    group: root
  become: yes

- name: Schedule daily backup
  ansible.builtin.cron:
    name: "Daily App Backup"
    minute: "0"
    hour: "3"
    job: "/usr/local/bin/backup_apps.sh"
  become: yes
